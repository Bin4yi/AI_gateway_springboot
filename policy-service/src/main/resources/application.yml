server:
  port: 8081

spring:
  application:
    name: policy-service
  datasource:
    url: jdbc:postgresql://localhost:5432/policy_db
    username: agentgate
    password: agentgate
  jpa:
    hibernate:
      ddl-auto: validate
  cache:
    type: caffeine
    caffeine:
      # At most 1000 answers, each removed 60 seconds after it was saved
      spec: maximumSize=1000,expireAfterWrite=60s
